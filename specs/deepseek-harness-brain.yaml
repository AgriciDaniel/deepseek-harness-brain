# Brainstein spec v3
spec_version: 3
slug: "deepseek-harness-brain"
title: "DeepSeek Harness Brain"
domain: "DeepSeek Harness architecture, operations, extension development, security, testing, and debugging"
buyer: "Developers and operators who need source-cited guidance for understanding, running, extending, or reviewing DeepSeek Harness."
owner: "Daniel Agrici"
repo_url: "https://github.com/deepseek-ai/deepseek-harness"
license_name: "MIT"
research_refresh_cadence: "on every DeepSeek Harness release or architecture change; monthly while the project remains in developer preview"
workflows:
  - "Orient a contributor across profiles, bundles, Cordis plugins, services, events, sessions, agents, tools, and clients"
  - "Trace one model turn from inbox admission through prompt assembly, LLM streaming, tool execution, persistence, and UI projection"
  - "Design a capability extension using Service Definition, Service Provider, and Consumer roles"
  - "Review a tool or plugin for permissions, sandboxing, approval, durable logging, teardown, and replay behavior"
  - "Diagnose lifecycle, cancellation, concurrency, subprocess, persistence, and configuration failures"
  - "Select the smallest meaningful verification tier and distinguish keyless, built, snapshot, browser, and real-API evidence"
  - "Run and configure Web or headless profiles without exposing credentials or weakening permission defaults"
raw_sources:
  - "The installed deepseek-ai/deepseek-harness checkout at pinned commit b150a551b8d465e31e418e1b2eaf5e79bbb7d28e"
  - "Repository-owned architecture, lifecycle, capability, testing, configuration, security, package, and user documentation"
  - "Repository source and tests for core session, agent, agent-loop, system-prompt, tools, LLM, sandbox, approval, persistence, boot, and client packages"
enrichment_sources:
  - "The upstream DeepSeek Harness GitHub repository and release history"
  - "The vendored Cordis source, primer, and linked spatiotemporal composability paper"
  - "Official Node.js, pnpm, DeepSeek API, and Agent Client Protocol documentation when a current compatibility claim requires it"
deliverables:
  - "System architecture map and profile composition guide"
  - "Turn, step, session, prompt, tool, and persistence lifecycle reference"
  - "Capability seam and plugin extension playbooks"
  - "Security and trust-boundary review with verified facts, inferences, and open risks separated"
  - "Testing and release evidence ladder"
  - "Configuration, operations, troubleshooting, and source navigation guides"
  - "Claim ledger, source ledger, glossary, and decision records tied to pinned source locators"
refusal_rules:
  - "No claim that a keyless, static, build, snapshot, browser, or real-API check proves a stronger tier than it actually ran"
  - "No invented package behavior, event semantics, defaults, compatibility promise, vulnerability, benchmark, or release status"
  - "No credentials, tokens, cookies, private settings, or local secret values in brain artifacts"
  - "No instruction to weaken sandbox, approval, host-trust, or credential boundaries merely to make a command pass"
  - "No mutation, publication, deployment, account change, or production action from this advisory brain"
  - "No reliance on archived Agent Notes as current authority when source or current documentation disagrees"
safety_risks:
  - "Developer-preview churn makes package names, defaults, events, and on-disk formats stale quickly"
  - "Everything-is-a-plugin flexibility can hide load-order, ownership, disposal, and cross-capability integration failures"
  - "A green unit suite can miss broken Loader composition, built entrypoints, browser output, or real-provider behavior"
  - "Permission, sandbox, approval, filesystem, subprocess, and credential layers can be confused as one control even though they are separate"
  - "Generated catalogs and bilingual derivatives may drift if hand-edited instead of regenerated through repository gates"
  - "Local build artifacts may be mistaken for tracked source or current release evidence"
playbook_steps:
  - "Freeze the repository commit and identify whether evidence comes from source, generated docs, tests, built artifacts, or live execution"
  - "Trace the owning plugin and its upstream inputs, downstream consumers, events, persistence, teardown, and failure behavior"
  - "Use current source and package README contracts before older Agent Notes or inferred conventions"
  - "Seek a counterexample or rejecting test for every material architectural or security claim"
  - "Run the smallest applicable check, then broaden only when the risk or requested evidence tier requires it"
  - "Record unresolved or volatile facts as unknown and assign a refresh condition"
audit_focus:
  - "source-ledger commit pinning and refresh dates"
  - "claim-to-source locator accuracy"
  - "architecture notes linked to concrete package owners and consumers"
  - "security findings separated from design limitations and unverified suspicions"
  - "verification claims matched to actual commands and evidence tiers"
  - "no placeholder text or unsupported current-state claims"
next_action_signals:
  - "upstream HEAD or package version changed from the pinned source"
  - "a current architecture document disagrees with package source or tests"
  - "a security claim lacks a direct policy or execution-path locator"
  - "a new capability has no Service Definition, Service Provider, or Consumer analysis"
  - "an operational answer depends on an unrun built, browser, native, or real-API gate"
claim_ledger_policy: "Every material claim names a pinned source locator and evidence tier; independent corroboration is required for security or comparative claims."
second_source_policy: "Required for security, compatibility, current release, comparative, numeric, and externally observable behavior claims."
source_refresh_days: 30
confidence_policy: "evidence-based, practitioner, contested, folklore"
canon_seed_count: 8
canon_targets:
  - "DeepSeek Harness architecture and Cordis composition"
  - "Agent turn and step lifecycle"
  - "Session log durability and replay"
  - "Tool execution and policy pipeline"
  - "Capability seam design"
  - "Defensive lifecycle and concurrency patterns"
  - "Testing evidence tiers"
  - "Profile, bundle, and patch-layer configuration"
canon_fold_targets:
  - "wiki/concepts"
  - "wiki/playbooks"
  - "wiki/decisions"
note_line_floor: 80
wikilink_target: 8
seed_gaps:
  - "Real-API behavior is not verified without a configured DeepSeek API key"
  - "Browser interaction and visual behavior require a running Web profile and browser review"
  - "Platform-specific behavior outside Linux x64 requires the matching CI or native host"
seed_questions:
  - "Which layer owns the authoritative decision being reviewed: composition, service, provider, consumer, policy, or projection?"
  - "What durable event or external observation proves the claimed behavior?"
  - "Which failure or counterexample would refute the leading interpretation?"
  - "Does the selected verification tier exercise source, built artifacts, assembled composition, browser output, or a live provider?"
seed_experiments:
  - "Boot a keyless real Loader composition and verify the observed world rather than model text"
  - "Reconstruct a model request from session events and compare it with the frozen request identity"
  - "Dispose a plugin contribution and verify its service, registry, listener, or tool is removed"
  - "Deny a mutating tool through the executor and verify the body did not run"
flow_playbooks:
  - "Repository Orientation Flow"
  - "Turn and Tool Trace Flow"
  - "Capability Seam Design Flow"
  - "Security and Trust Review Flow"
  - "Failure Diagnosis Flow"
  - "Verification Tier Selection Flow"
verification_modes:
  - "source and contract locator audit"
  - "focused unit or property test"
  - "real Loader composition smoke"
  - "built entrypoint smoke"
  - "keyless transcript snapshot"
  - "browser replay snapshot"
  - "live provider e2e"
  - "fresh-context claim verifier"
eval_seed_count: 24
secretary_mode: "single"
curator_themes:
  - "architecture and ownership"
  - "durability and replay"
  - "security and permissions"
  - "testing and release evidence"
publish_surface: "sanitized-quartz"
public_exclude_patterns:
  - ".raw"
  - ".obsidian"
  - "hot.md"
  - "log.md"
  - "references/source-ledger.json"
  - "references/claim-ledger.md"
public_content_policy: "Publish original synthesis, pinned public links, compliant short quotes, and explicit evidence limits only."
corpus_scope_policy: "Every source note states commit, retrieval date, source class, inspected scope, and exclusions."
context_budget_policy: "Use the hot cache and overview first, then retrieve owning notes and pinned source locators just in time."
retrieval_pattern: "wiki navigation plus exact package and event lookup plus graph traversal"
provenance_trace_policy: "pinned source to claim to concept or playbook to decision or deliverable"
memory_governance_policy: "write, store, retrieve, execute, share, forget, rollback"
mutation_policy: "advisory-read-only-v1"
adapter_domain_depth: "repository inventory plus source locators plus lifecycle synthesis plus verification playbooks plus deterministic fixtures"
live_api_spend_cap_usd: 0
answer_engine_policy: "Prefer direct current source and official documentation, with no search-engine optimization claims."
substance_profile: "fable-grade"
uncertainty_eval_policy: "Reward explicit no-data and tier limits; penalize confident unsupported answers and test-tier inflation."
