name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall scripts deepseek_harness_brain tests
      - name: CLI smoke
        run: deepseek-harness-brain --help
      - name: Template vault lint
        run: python scripts/lint_vault.py --vault assets/template-brain --template
      - name: Pipeline tests
        run: python tests/test_pipeline.py
      - name: Demo vault drift
        run: |
          python scripts/build_demo_vault.py
          git diff --exit-code -- examples/sample-vault
      - name: Release package and audit
        run: python scripts/package_release.py --version 0.2.0 --release-type community-ready
