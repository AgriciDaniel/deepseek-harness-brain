[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness-brain"
version = "0.2.0"
description = "DeepSeek Harness Brain Obsidian brain template and script layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Daniel Agrici"}]
dependencies = []

[project.scripts]
deepseek-harness-brain = "deepseek_harness_brain.cli:main"

[tool.setuptools]
packages = ["deepseek_harness_brain"]
